services:
  batbliz-db:
    image: postgres:15
    container_name: batbliz_postgres
    restart: always
    environment:
      POSTGRES_USER: batbliz
      POSTGRES_PASSWORD: batbliz
      POSTGRES_DB: batbliz_db
    ports:
      - "5432:5432"
    volumes:
      - batbliz_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batbliz -d batbliz_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  batbliz-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batbliz_api
    restart: unless-stopped
    depends_on:
      batbliz-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env - inside the compose
      # network the db is reachable by service name, not localhost.
      DATABASE_URL: postgresql://batbliz:batbliz@batbliz-db:5432/batbliz_db?schema=public
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  batbliz_data:
